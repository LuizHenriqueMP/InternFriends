services:
  mysql:
    image: mysql:8.4
    container_name: quadro-comentarios-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: quadro_comentarios
      MYSQL_USER: quadro
      MYSQL_PASSWORD: quadro
      MYSQL_ROOT_PASSWORD: root
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
